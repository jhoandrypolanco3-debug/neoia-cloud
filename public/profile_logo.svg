<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#082338"/>
      <stop offset="60%" stop-color="#040a14"/>
      <stop offset="100%" stop-color="#020408"/>
    </radialGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#37e6ff"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1080" height="1080" fill="url(#bgGlow)"/>

  <!-- Outer Hexagon Cyber Ring -->
  <polygon points="540,110 910,325 910,755 540,970 170,755 170,325" 
           fill="none" stroke="rgba(6, 182, 212, 0.25)" stroke-width="6" stroke-dasharray="14,14"/>

  <!-- Inner Glowing Shield -->
  <polygon points="540,140 880,340 880,740 540,940 200,740 200,340" 
           fill="rgba(8, 19, 37, 0.85)" stroke="url(#cyanGrad)" stroke-width="12" filter="url(#glow)"/>

  <!-- Stylized Tech N Logo -->
  <path d="M380 720 V360 L700 720 V360" 
        fill="none" stroke="url(#cyanGrad)" stroke-width="44" 
        stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>

  <!-- Glowing Circuit Nodes -->
  <circle cx="380" cy="360" r="22" fill="#37e6ff" filter="url(#glow)"/>
  <circle cx="700" cy="720" r="22" fill="#10b981" filter="url(#glow)"/>
  <circle cx="540" cy="540" r="14" fill="#37e6ff"/>

  <!-- Bottom Brand Text -->
  <text x="540" y="870" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="52" fill="#ffffff" letter-spacing="12" text-anchor="middle">NEOIA</text>
  <text x="540" y="915" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="24" fill="#37e6ff" letter-spacing="8" text-anchor="middle">ROBOTICS TECHNOLOGIES</text>
</svg>
