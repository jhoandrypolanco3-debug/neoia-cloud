# Render.com — configuracion del servicio (plan gratis)
# Sube este repo a GitHub y conéctalo en render.com
services:
  - type: web
    name: neoia
    runtime: python
    plan: free
    region: oregon
    buildCommand: "echo 'sin dependencias que instalar'"
    startCommand: "python server.py"
    healthCheckPath: /api/status
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.0"
      # La clave de DeepSeek se pone en el panel de Render (NO en el repo)
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: DEEPSEEK_MODEL
        value: "deepseek-chat"
